[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qrpack"
version = "0.1.0"
description = "Pack a folder into printable QR codes and restore it from a photo."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Arsen Toktarbek", email = "216891376+arsentis@users.noreply.github.com" },
]
keywords = [
    "qr",
    "qrcode",
    "backup",
    "paper-backup",
    "archive",
    "offline",
    "air-gap",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "segno>=1.6",
    "pillow>=10",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/arsentis/qrpack"
Repository = "https://github.com/arsentis/qrpack"
Issues = "https://github.com/arsentis/qrpack/issues"
Changelog = "https://github.com/arsentis/qrpack/releases"

[project.scripts]
qrpack = "qrpack.cli:main"

[tool.setuptools.packages.find]
include = ["qrpack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
